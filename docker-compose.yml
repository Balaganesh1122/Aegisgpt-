version: "3.9"

services:

  backend:
    build: ./backend
    container_name: aegis_backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    depends_on:
      - postgres
      - redis

    env_file:
      - .env

  postgres:
    image: pgvector/pgvector:pg17

    container_name: aegis_postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aegis

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: aegis_redis

    restart: always

    ports:
      - "6379:6379"

volumes:
  postgres_data: